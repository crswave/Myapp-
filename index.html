<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Life OS • Personal Hub</title>
  <meta name="theme-color" content="#FAF8F5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Google Fonts: Newsreader & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            paper: {
              50: '#FCFBF9',
              100: '#FAF8F5',
              200: '#F4EFEA',
              300: '#EAE3DA',
              400: '#D5CCC0',
              border: '#E8E2D8',
            },
            ink: {
              primary: '#1C1917',
              secondary: '#44403C',
              muted: '#78716C',
              faint: '#A8A29E',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    body {
      background-color: #FAF8F5;
      color: #1C1917;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    .college-ruled {
      background-color: #FAF8F5;
      background-image: linear-gradient(#D5DFEB 1px, transparent 1px);
      background-size: 100% 28px;
      line-height: 28px;
    }

    .red-margin-line {
      border-left: 2px solid rgba(239, 68, 68, 0.45);
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #D5CCC0;
      border-radius: 9999px;
    }

    .paper-card {
      background: #FFFFFF;
      border: 1px solid #E8E2D8;
      box-shadow: 0 4px 18px -4px rgba(28, 25, 23, 0.05), 0 1px 3px 0 rgba(28, 25, 23, 0.03);
    }

    .rail-glass {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(232, 226, 216, 0.95);
      box-shadow: 0 10px 30px -5px rgba(28, 25, 23, 0.08), 0 2px 6px -1px rgba(28, 25, 23, 0.04);
    }

    @keyframes orbFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-12px) scale(1.02); }
    }

    @keyframes orbGlowPulse {
      0%, 100% {
        box-shadow: 0 0 35px 8px rgba(245, 158, 11, 0.28), 0 20px 45px -10px rgba(217, 119, 6, 0.35);
      }
      50% {
        box-shadow: 0 0 60px 18px rgba(245, 158, 11, 0.45), 0 25px 60px -5px rgba(217, 119, 6, 0.5);
      }
    }

    @keyframes recordingRipple {
      0% { transform: scale(0.95); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .ai-orb-core {
      animation: orbFloat 4.2s ease-in-out infinite, orbGlowPulse 3.6s ease-in-out infinite;
    }

    .pulse-ring {
      animation: recordingRipple 1.7s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
    }
  </style>
</head>
<body class="h-full w-full select-none overflow-hidden text-ink-primary flex flex-col justify-between">
