<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one quiet column; the assistant block is the single loud element, the rundown slides sideways beneath it. */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --sunk:#ECEFEE;
  --ink:#141B19; --muted:#5F6B67; --faint:#98A29E; --line:#DFE4E2;
  --accent:#2C47CF; --accent-ink:#FFFFFF; --accent-soft:#E6EAFB;
  --good:#1D7A52; --warn:#A8650A; --crit:#B93A32;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(20,27,25,.05),0 8px 24px -12px rgba(20,27,25,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101413; --surface:#181D1C; --sunk:#1F2524;
    --ink:#ECF0EE; --muted:#9CA8A4; --faint:#6C7774; --line:#2A3230;
    --accent:#93A5FF; --accent-ink:#0D1330; --accent-soft:#222A4D;
    --good:#5CC597; --warn:#E0A64B; --crit:#F0857C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101413; --surface:#181D1C; --sunk:#1F2524;
  --ink:#ECF0EE; --muted:#9CA8A4; --faint:#6C7774; --line:#2A3230;
  --accent:#93A5FF; --accent-ink:#0D1330; --accent-soft:#222A4D;
  --good:#5CC597; --warn:#E0A64B; --crit:#F0857C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
h1,h2{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{display:none}
main{flex:1;min-width:0;padding:20px 16px 104px}
.col{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:28px;min-width:0}
.col > *,.sec > *{min-width:0;max-width:100%}
.sec > .rail,.sec > .fchips,#rail-wrap > .rail{max-width:none}
main{overflow-x:clip}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
@media (min-width:1100px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:28px;width:228px;flex:none;padding:28px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
  main{padding:44px 32px 64px}
  .brand{padding:0 10px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav .tab{flex:none;flex-direction:row;gap:11px;justify-content:flex-start;padding:9px 10px;font-size:15px}
  .nav .tab svg{width:19px;height:19px}
  .nav .tab[aria-current="page"]{background:var(--accent-soft)}
  .nav .tab:hover{color:var(--ink)}
  .side .status{margin-top:auto;padding:0 10px}
}
.brand b{display:block;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.status[data-s="saving"] i{background:var(--warn)}
.status[data-s="error"] i{background:var(--crit)}
.status[data-s="local"] i{background:var(--faint)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
@media (min-width:1100px){.topbar .brand,.topbar .status{display:none}.topbar{display:none}}

/* Today hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.date{display:flex;align-items:flex-end;gap:14px}
.date .d{font-family:var(--display);font-weight:700;font-size:clamp(60px,17vw,84px);line-height:.8;letter-spacing:-.05em}
.date .w{display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.date .w b{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em}
.date .w span{color:var(--muted);font-size:15px}
.score{display:flex;align-items:center;gap:12px}
.score svg{width:54px;height:54px;flex:none}
.score .t{font-size:14px;color:var(--muted);max-width:15ch}
.score .t b{display:block;color:var(--ink);font-size:16px;font-weight:600}
.greet{font-size:17px;color:var(--muted)}
.greet b{color:var(--ink);font-weight:600}

/* Sections */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.sec-h .more{font-size:14px;color:var(--accent);font-weight:500}
.page-h h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.025em;line-height:1.05}
.page-h p{color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{padding:22px 16px;color:var(--muted);font-size:15px;text-align:left}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.group-l{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:14px 16px 4px}

/* Rows */
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px 12px 16px;border-top:1px solid var(--line)}
.card > .row:first-child,.group-l + .row{border-top:0}
.check{width:24px;height:24px;flex:none;border-radius:50%;border:1.75px solid var(--faint);display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s}
.check svg{width:13px;height:13px;stroke:var(--accent-ink);opacity:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] svg{opacity:1}
.check.pri{border-color:var(--crit)}
.row .body{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.row .title{overflow-wrap:anywhere}
.row.done .title{color:var(--faint);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted)}
.meta .late{color:var(--crit);font-weight:500}
.meta .flag{color:var(--crit);font-weight:500}
.icon-btn{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

/* Forms */
.add{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.card > .add:first-child{border-top:0}
.field{flex:1 1 180px;min-width:0;background:var(--sunk);border:1px solid transparent;border-radius:var(--r-sm);padding:10px 12px}
.field::placeholder{color:var(--faint)}
.field:focus{outline:0;border-color:var(--accent);background:var(--surface)}
input[type="date"].field{flex:0 1 150px}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:var(--r-sm);padding:10px 16px;flex:none}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--crit);padding-left:4px;padding-right:4px}
.toggle{flex:none;border-radius:var(--r-sm);padding:10px 12px;background:var(--sunk);color:var(--muted);font-weight:500;font-size:14px}
.toggle[aria-pressed="true"]{background:color-mix(in srgb,var(--crit) 14%,var(--surface));color:var(--crit)}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .n{color:var(--faint);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px}
.chip{border:1px dashed var(--faint);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--ink)}

/* Habits */
.habit{display:flex;align-items:center;gap:12px;padding:13px 10px 13px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.card > .habit:first-child{border-top:0}
.habit .body{flex:1 1 140px;min-width:0}
.habit .name{font-weight:500;overflow-wrap:anywhere}
.streak{font-size:13px;color:var(--muted)}
.streak.on{color:var(--good);font-weight:500}
.week{display:flex;gap:5px}
.day{width:30px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--faint)}
.day i{width:26px;height:26px;border-radius:8px;background:var(--sunk);display:block;border:1.5px solid transparent}
.day[aria-pressed="true"] i{background:var(--accent)}
.day.today{color:var(--ink);font-weight:600}
.day.today i{border-color:var(--accent)}
.hchips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.hchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 10px;font-weight:500;font-size:15px}
.hchip i{width:18px;height:18px;border-radius:50%;border:1.75px solid var(--faint);display:grid;place-items:center}
.hchip i svg{width:10px;height:10px;stroke:var(--accent-ink);opacity:0}
.hchip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent}
.hchip[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.hchip[aria-pressed="true"] i svg{opacity:1}

/* Goals */
.goal{padding:14px 12px 14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.card > .goal:first-child{border-top:0}
.goal .top{display:flex;align-items:center;gap:8px}
.goal .top .body{flex:1;min-width:0;text-align:left}
.goal .name{font-weight:500;overflow-wrap:anywhere}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.bar.full i{background:var(--good)}
.step{display:flex;gap:4px}
.step button{width:34px;height:34px;border-radius:9px;background:var(--sunk);font-size:18px;font-weight:500;line-height:1}

/* Journal */
.jnav{display:flex;align-items:center;gap:6px;padding:10px 10px 0 16px}
.jnav b{flex:1;font-family:var(--display);font-weight:600;font-size:18px}
.entry{display:block;width:100%;min-height:150px;resize:none;border:0;background:transparent;padding:10px 16px 6px;line-height:1.6;overflow:hidden}
.entry:focus{outline:0}
.entry::placeholder{color:var(--faint)}
.jfoot{display:flex;justify-content:space-between;padding:0 16px 12px;font-size:12.5px;color:var(--faint)}
.past{display:flex;flex-direction:column;gap:2px;padding:13px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.card > .past:first-child{border-top:0}
.past b{font-size:13px;color:var(--muted);font-weight:600}
.past span,.note span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.note{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-height:92px}
.note b{font-weight:600;overflow-wrap:anywhere}
.note span{color:var(--muted);font-size:14.5px;-webkit-line-clamp:4}
.note em{font-style:normal;font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;animation:up .18s ease-out}
@media (min-width:560px){.scrim{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--display);font-weight:600;font-size:20px}
.sheet label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.sheet label.inline{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.sheet .field{flex:none;width:100%}
.sheet textarea.field{min-height:150px;resize:vertical;line-height:1.5}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .acts{display:flex;gap:8px;align-items:center}
.sheet .acts .sp{flex:1}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.loading{color:var(--muted);padding:40px 0}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.orb-btn{width:min(60vw,230px);aspect-ratio:1;border-radius:50%;display:block;transition:width .25s}
.stage.small .orb-btn{width:132px}
.orb-btn canvas{width:100%;height:100%;display:block}
.stage h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin-top:-6px}
.stage p{color:var(--muted);font-size:15px;min-height:1.45em}
.tools.mid{justify-content:center}
.pane{display:contents}
.rail-status{display:none}

/* Today: the plan leads. Greeting, then the one thing to do now, then the rest. */
.hello{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.hello h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,7.4vw,34px);line-height:1.08;letter-spacing:-.025em;text-wrap:balance}
.hello .dline{margin-top:6px;font-size:14px;color:var(--muted);display:flex;column-gap:12px;row-gap:2px;flex-wrap:wrap}
.hello .dline .sun{white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.hello .dline .sun i{width:7px;height:7px;border-radius:50%;background:var(--gold,#B3995D)}
.hello .score{flex:none;gap:4px}
.hello .score svg{width:46px;height:46px}
.gstrip{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));border-left:4px solid var(--gold,#B3995D)}
.gstrip .gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gstrip .gt b{font-weight:600;overflow-wrap:anywhere}
.gstrip .gt span{font-size:13px;color:var(--muted)}
.gstrip .gs{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;white-space:nowrap}
.gstrip .pill.live{flex:none}
.nextup{padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.nextup .lab{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.nextup .lab.late{color:var(--crit)}
.nextup .big{display:flex;gap:12px;align-items:flex-start}
.nextup .big .check{width:30px;height:30px;margin-top:2px}
.nextup .big .check svg{width:15px;height:15px}
.nextup .big .body{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:4px}
.nextup .big .title{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.2;letter-spacing:-.015em;overflow-wrap:anywhere}
.nextup .acts{display:flex;gap:8px;flex-wrap:wrap}
.nextup .acts .btn{padding:9px 14px;font-size:14.5px}
.nextup .sub{color:var(--muted);font-size:15px}
.wrap .stat{display:flex;gap:18px;flex-wrap:wrap}
.wrap .stat div{display:flex;flex-direction:column}
.wrap .stat b{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.05}
.wrap .stat span{font-size:13px;color:var(--muted)}
.wrap .left{display:flex;flex-direction:column;gap:2px;font-size:15px}
.wrap .left li{list-style:none;color:var(--ink);overflow-wrap:anywhere}
.wrap .left ul{margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.wrap .left li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin:0 9px 2px 1px}
.wrap .entry{min-height:60px;padding:10px 12px;background:var(--sunk);border-radius:var(--r-sm)}
.soon .row .body{gap:0}
.hint{font-size:13px;color:var(--faint);padding:0 2px}

/* Juno bar: always at hand, never in the way */
.jbar{order:9;position:sticky;bottom:78px;z-index:5;display:flex;align-items:center;gap:8px;padding:7px 7px 7px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.jbar input{flex:1;min-width:0;border:0;background:transparent;padding:10px 4px}
.jbar input:focus{outline:0}
.jbar .rbtn{width:40px;height:40px;background:var(--sunk);color:var(--ink)}
.jbar .rbtn.go{background:var(--accent);color:var(--accent-ink)}
.jbar .rbtn[aria-pressed="true"]{background:var(--crit);color:#fff}
@media (min-width:1100px){.jbar{bottom:20px}}
.jorb{--o:var(--accent);width:26px;height:26px;flex:none;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--o) 30%,#fff) 0,var(--o) 52%,color-mix(in srgb,var(--o) 55%,#000) 100%);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--o) 16%,transparent),0 0 14px color-mix(in srgb,var(--o) 45%,transparent);
  animation:breathe 4.5s ease-in-out infinite;transition:--o .4s}
.jorb[data-s="listen"]{--o:var(--crit);animation:listen 1s ease-in-out infinite}
.jorb[data-s="think"]{animation:breathe 1.2s ease-in-out infinite}
.jorb[data-s="think"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 60%,color-mix(in srgb,var(--o) 70%,#fff) 85%,transparent 100%);mask:radial-gradient(circle,transparent 58%,#000 60%);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);animation:spin 1s linear infinite}
.jorb[data-s="saved"]{--o:var(--good);animation:pop .5s ease-out}
@keyframes breathe{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--o) 10%,transparent),0 0 20px color-mix(in srgb,var(--o) 55%,transparent)}}
@keyframes listen{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--o) 14%,transparent),0 0 22px color-mix(in srgb,var(--o) 60%,transparent);transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* Rundown tab */
.stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.stack .rcard{min-height:0}
.eyebrow > span{white-space:nowrap}
.eyebrow .pill{overflow:hidden;text-overflow:ellipsis}


/* Assistant */
.juno{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.juno .who{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.orb{width:14px;height:14px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 25%,transparent);flex:none}
.orb.on{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,currentColor 8%,transparent)}}
.juno p{font-size:16.5px;line-height:1.4;opacity:.94}
.ask{display:flex;gap:8px;align-items:center}
.ask input{flex:1;min-width:0;border:0;border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--accent-ink) 16%,transparent);color:var(--accent-ink)}
.ask input::placeholder{color:color-mix(in srgb,var(--accent-ink) 68%,transparent)}
.ask input:focus{outline:2px solid var(--accent-ink);outline-offset:1px}
.rbtn{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--accent-ink) 16%,transparent);color:var(--accent-ink)}
.rbtn svg{width:20px;height:20px}
.rbtn.go{background:var(--accent-ink);color:var(--accent)}
.rbtn[aria-pressed="true"]{background:var(--crit);color:#fff;animation:pulse 1.1s ease-in-out infinite}
.juno :focus-visible{outline-color:var(--accent-ink)}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchips button{border:1px solid color-mix(in srgb,var(--accent-ink) 38%,transparent);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.note{align-self:center;background:none;color:var(--muted);font-size:14px;padding:2px 8px;text-align:center}
.msg.wait{color:var(--muted)}
.composer{position:sticky;bottom:76px;display:flex;gap:8px;align-items:center;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.composer input{flex:1;min-width:0;border:0;background:transparent;padding:10px 8px}
.composer input:focus{outline:0}
.composer .rbtn{background:var(--sunk);color:var(--ink)}
.composer .rbtn.go{background:var(--accent);color:var(--accent-ink)}
.composer .rbtn[aria-pressed="true"]{background:var(--crit);color:#fff}
@media (min-width:1100px){.composer{bottom:20px}}
.vn-status{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted)}
.vn-status .orb{color:var(--faint)}
.vn-status.on{color:var(--crit)}
.vn-status.on .orb{color:var(--crit)}
#vn-partial{color:var(--faint);font-size:14.5px;min-height:1.4em}

/* Rundown rail */
.fresh{font-size:13px;color:var(--muted)}
.fresh.stale{color:var(--warn)}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.fchips::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.fchips button{white-space:nowrap;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;color:var(--muted);background:var(--sunk)}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:4px 16px 14px;scroll-padding-left:16px}
.rcard{flex:0 0 min(78%,290px);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:186px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.rcard.news .eyebrow{color:var(--accent)}
.pill{font-size:11.5px;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.live{background:color-mix(in srgb,var(--crit) 15%,var(--surface));color:var(--crit)}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--muted)}
.srow b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow span{font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:-.02em;line-height:1}
.srow.win{color:var(--ink)}
.srow.win b{font-weight:600}
.rcard .foot{margin-top:auto;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.rcard.news h3{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.22;letter-spacing:-.01em;text-wrap:balance}
.rcard.news p{font-size:14.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rcard.news .foot b{color:var(--accent);font-weight:600}
.side .set{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--muted);font-size:15px;font-weight:500;margin-top:auto}
.side .set svg{width:19px;height:19px}
.side .set + .status{margin-top:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Unfolded foldable (iPhone Duo inner display). In the Claude app the page gets roughly 810 x 510 points,
   so this mode is a fixed, full-height app: two panes that scroll on their own, nothing clipped sideways,
   and the tabs in a rail on the right edge. The pane gutter sits a little right of center, where the fold falls. */
@media (min-width:700px) and (max-width:1099.98px){
  html,body{height:100%;overflow:hidden}
  .shell{height:100%;min-height:0}
  main{height:100%;padding:0 64px 0 0;overflow:hidden}
  main > .col{height:100%;max-width:none;margin:0;gap:0}
  .topbar{display:none}
  .tabbar{top:0;bottom:0;left:auto;right:0;width:64px;flex-direction:column;justify-content:center;gap:4px;border-top:0;border-left:1px solid var(--line);padding:8px 6px 26px}
  .tab{flex:none;padding:9px 2px}
  .rail-status{display:flex;position:fixed;right:0;bottom:12px;width:64px;justify-content:center;z-index:21}
  .rail-status span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  #view{height:100%;max-width:none;width:100%;margin:0;overflow-y:auto;padding:16px max(16px,calc(50% - 300px)) 28px;gap:22px!important;overscroll-behavior:contain}
  #view.split{display:grid;grid-template-columns:calc(55vw - 26px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);column-gap:20px;padding:0 6px 0 10px;overflow:hidden;align-items:stretch}
  .pane{display:flex;flex-direction:column;gap:20px;min-width:0;height:100%;overflow-y:auto;padding:14px 6px 30px;overscroll-behavior:contain;scrollbar-width:none}
  .pane::-webkit-scrollbar{display:none}
  .pane > *{min-width:0;max-width:100%;flex:none}
  .hero{flex-wrap:nowrap;align-items:center}
  .date{align-items:center;gap:10px}
  .date .d{font-size:46px;line-height:1}
  .date .w{padding:0}
  .date .w b{font-size:17px}
  .date .w span{font-size:13px}
  .score > svg{width:40px;height:40px}
  .juno{padding:14px;gap:10px;border-radius:18px}
  .juno p{font-size:15.5px}
  /* The rundown becomes a straight list: every card fully visible, scroll down for more. */
  .fchips{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
  .rail{flex-direction:column;overflow:visible;scroll-snap-type:none;margin:0;padding:0;gap:10px}
  .rcard{flex:none;min-height:0;padding:12px 14px;gap:8px}
  .srow span{font-size:23px}
  .rcard.news h3{font-size:16.5px}
  .rcard.news p{-webkit-line-clamp:2}
  .composer{bottom:0}
  #view.split.flip > .pane:first-child{order:2}
  .pane.center{justify-content:safe center}
  .pane > .composer{margin-top:auto}
  .pane > .jbar{margin-top:auto;bottom:0}
  .hello h1{font-size:27px}
  .nextup .big .title{font-size:21px}
  .stack{grid-template-columns:1fr}
  .pane > .thread{padding-top:4px}
  .orb-btn,.stage.small .orb-btn{width:min(100%,210px)}
  .toast{bottom:24px}
  .notes{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
}
/* Short screens such as the Duo's 5.4-inch outer display (about 466 x 678 points) */
@media (max-height:720px) and (max-width:699.98px){
  main{padding-top:14px}
  .col,#view{gap:22px!important}
  .date .d{font-size:60px}
  .juno{padding:15px 14px 14px;gap:10px}
  .tab{padding:5px 2px}
  .rcard{min-height:168px}
}

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const dkey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const dparse = k => { const p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (k, n) => { const d = dparse(k); d.setDate(d.getDate() + n); return dkey(d); };
const today = () => dkey(new Date());
const diffDays = (a, b) => Math.round((dparse(a) - dparse(b)) / 864e5);
const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MO = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const shortDate = k => { const d = dparse(k); return WD[d.getDay()].slice(0,3) + ", " + MO[d.getMonth()].slice(0,3) + " " + d.getDate(); };
const longDate = k => { const d = dparse(k); return WD[d.getDay()] + ", " + MO[d.getMonth()] + " " + d.getDate(); };
function dueLabel(k){
  const n = diffDays(k, today());
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  if (n > 1 && n < 7) return WD[dparse(k).getDay()];
  return shortDate(k);
}
function streak(h){
  const log = h.log || {};
  let k = today();
  if (!log[k]) k = addDays(k, -1);
  let n = 0;
  while (log[k]) { n++; k = addDays(k, -1); }
  return n;
}
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>',
  assistant:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7z"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.3-1.3L14 3h-4l-.3 2.5a7 7 0 0 0-2.3 1.3l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .9.1 1.3l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.3 1.3L10 21h4l.3-2.5a7 7 0 0 0 2.3-1.3l2.3 1 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z"/></svg>',
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>',
  tasks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.6 1.6L8.5 5M4 12.5l1.6 1.6 2.9-3.1M4 18.5l1.6 1.6 2.9-3.1M12 7h8M12 13h8M12 19h8"/></svg>',
  habits:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  journal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M10 8h5M10 12h5"/></svg>',
  rundown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v13a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2zM17 9h3v9a2 2 0 0 1-4 0M7.5 9h6M7.5 12.5h6M7.5 16h4"/></svg>',
  check:'<svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};

/* ---------- state ---------- */
const S = { tasks: [], habits: [], goals: [], days: {}, notes: {} };
let CFG = { assistantName: "Juno", teams: [], topics: [], tier: "fast" };
let FEED = null;
const AI = { sample: null, tools: false, turns: [], busy: false, partial: "", note: "", ctl: null };
let D = null;
const UI = { feedFilter: "all", draft: "", listening: false, dictTarget: "", ready: false, slow: false, route: "home", taskFilter: "today", addPri: false, jTab: "journal", jDate: today(), noteQ: "", name: "", focusAfter: null };
const store = { db: null, uid: null, mode: "loading" };
const ROUTES = ["home", "assistant", "tasks", "habits", "journal", "rundown"];
const LABEL = { home: "Today", assistant: "Assistant", tasks: "Tasks", habits: "Habits", journal: "Journal", rundown: "Rundown" };
const aiName = () => (CFG.assistantName || "Juno");

/* ---------- saving ---------- */
const savers = new Set();
let saveError = false;
function setStatus(){
  let s = "saved", t = "Saved";
  if (store.mode === "loading") { s = "saving"; t = "Loading"; }
  else if (store.mode === "local") { s = "local"; t = "Saved on this device only"; }
  else if (saveError) { s = "error"; t = "Not saved. Check your connection"; }
  else if ([...savers].some(x => x.dirty)) { s = "saving"; t = "Saving"; }
  document.querySelectorAll("[data-status]").forEach(el => { el.dataset.s = s; el.lastElementChild.textContent = t; });
}
function persistLocal(){
  if (store.mode !== "local") return;
  try { localStorage.setItem("personal-hub-v1", JSON.stringify(Object.assign({}, S, { cfg: CFG, chat: AI.turns }))); } catch (e) {}
}
function makeSaver(refFn, dataFn){
  let timer = null, busy = false, again = false, tries = 0;
  const s = { dirty: false, schedule(){
    s.dirty = true;
    if (store.mode !== "cloud") { persistLocal(); s.dirty = false; setStatus(); return; }
    setStatus(); clearTimeout(timer); timer = setTimeout(run, 600);
  }};
  async function run(){
    clearTimeout(timer);
    if (busy) { again = true; return; }
    busy = true;
    let ok = true;
    try {
      const data = dataFn();
      if (data === null) await refFn().delete();
      else await refFn().set(JSON.parse(JSON.stringify(data)));
    } catch (e) { ok = false; }
    busy = false;
    if (!ok) {
      saveError = true; setStatus();
      if (tries++ < 4) timer = setTimeout(run, 4000);
      return;
    }
    tries = 0; saveError = false;
    if (again) { again = false; return run(); }
    s.dirty = false; setStatus();
  }
  savers.add(s);
  return s;

const userDoc = name => store.db.doc("data/users/" + store.uid + "/" + name);
const saveTasks = makeSaver(() => userDoc("tasks"), () => ({ items: S.tasks }));
const saveHabits = makeSaver(() => userDoc("habits"), () => ({ habits: S.habits, goals: S.goals }));
const saveCfg = makeSaver(() => store.db.doc("hub/config"), () => CFG);
const saveChat = makeSaver(() => userDoc("assistant"), () => ({ turns: AI.turns.slice(-40) }));
const daySavers = {}, noteSavers = {};
function saveDay(k){
  if (!daySavers[k]) daySavers[k] = makeSaver(() => userDoc("journal").collection("days").doc(k), () => (S.days[k] && S.days[k].text.trim()) ? S.days[k] : null);
  daySavers[k].schedule();
}
function saveNote(id){
  if (!noteSavers[id]) noteSavers[id] = makeSaver(() => userDoc("journal").collection("notes").doc(id), () => S.notes[id] || null);
  noteSavers[id].schedule();
}

/* ---------- loading ---------- */
let pendingRender = false;
function typing(){
  const a = document.activeElement;
  return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && (a.value || a.closest(".sheet"));
}
function softRender(){ if (typing()) pendingRender = true; else render(); }
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !typing()) { pendingRender = false; render(); } }, 50));

function loadLocal(){
  try {
    const raw = JSON.parse(localStorage.getItem("personal-hub-v1") || "null");
    if (raw) { for (const k of Object.keys(S)) if (raw[k]) S[k] = raw[k]; if (raw.cfg) CFG = Object.assign(CFG, raw.cfg); if (raw.chat) AI.turns = raw.chat; if (raw.feed) FEED = raw.feed; }

  const got = new Set();
  const slowTimer = setTimeout(() => { if (!UI.ready) { UI.slow = true; render(); } }, 10000);

    got.add(n);

  const fail = n => () => { mark(n); saveError = true; setStatus(); };

  userDoc("tasks").onSnapshot(snap => {
    if (!snap.metadata.hasPendingWrites && !saveTasks.dirty) {

function sortTasks(a, b){
  if (!!a.due !== !!b.due) return a.due ? -1 : 1;
  if (a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (!!a.pri !== !!b.pri) return a.pri ? -1 : 1;
  return (a.created || 0) - (b.created || 0);
}
function taskSets(){
  const t = today();
  const open = S.tasks.filter(x => !x.done).sort(sortTasks);
  const doneToday = S.tasks.filter(x => x.done && x.doneAt === t && x.due && x.due <= t);
  return {
    today: open.filter(x => x.due && x.due <= t),
    doneToday,
    upcoming: open.filter(x => x.due && x.due > t),
    nodate: open.filter(x => !x.due),
    done: S.tasks.filter(x => x.done).sort((a, b) => (b.doneTs || 0) - (a.doneTs || 0))
  };
}

// Sunrise and sunset are worked out for home: Pittsburg, California.
const HOME = { lat: 38.028, lng: -121.885 };
function sunTimes(day){
  const rad = Math.PI / 180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397, J0 = 0.0009, TWO = 2 * Math.PI;
  const noon = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 12);
  const lw = rad * -HOME.lng, phi = rad * HOME.lat;
  const d = noon.valueOf() / dayMs - 0.5 + J1970 - J2000;
  const n = Math.round(d - J0 - lw / TWO);
  const ds = J0 + lw / TWO + n;
  const M = rad * (357.5291 + 0.98560028 * ds);
  const L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const transit = a => J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const Jnoon = transit(ds);
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const Jset = transit(J0 + (w + lw) / TWO + n);
  const fromJ = j => new Date((j + 0.5 - J1970) * dayMs);
  return { rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset) };

// Four moods. Light phases fade into each other over an hour; the switch to and from night is a short fade.
const PAL = {
  morning: { dark: 0, bg: "#FBF6EF", surface: "#FFFFFF", sunk: "#F3ECE2", ink: "#1F1A15", muted: "#6E645A", faint: "#A69B90", line: "#EAE0D4", accent: "#B4561A" },
  day:     { dark: 0, bg: "#F4F6F7", surface: "#FFFFFF", sunk: "#ECEFF1", ink: "#141A1E", muted: "#5D6870", faint: "#97A1A8", line: "#DEE3E6", accent: "#2C47CF" },
  evening: { dark: 0, bg: "#EEEAEE", surface: "#FBF9FA", sunk: "#E4DEE3", ink: "#1F1A22", muted: "#665E6A", faint: "#9D94A0", line: "#DCD5DB", accent: "#6A45C0" },
  night:   { dark: 1, bg: "#101216", surface: "#181B21", sunk: "#20242B", ink: "#E8EBEF", muted: "#9AA1AB", faint: "#6A717B", line: "#2A2F37", accent: "#A9B1FF" }

const hex = a => "#" + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");

    [at(11), "morning", "day"],

const G = { id: "", bucket: "", day: "" };
function pickGreeting(c){
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem("hub-greet-recent") || "[]"); if (!Array.isArray(recent)) recent = []; } catch (e) {}
  const fits = LINES.filter(x => (!x[1] || x[1].includes(c.b)) && x[5](c));
  if (!fits.length) return null;
  let pool = fits.filter(x => !recent.includes(x[0]));
  if (!pool.length) pool = fits;
  const prefer = (arr, test, p) => { const yes = arr.filter(test), no = arr.filter(x => !test(x)); return yes.length && (Math.random() < p || !no.length) ? yes : (no.length ? no : arr); };
  // Moments first when there is one, then lines about your day, then plain time-of-day lines.
  const kinds = pool.map(x => x[4]);
  if (kinds.includes("m") && Math.random() < .6) pool = pool.filter(x => x[4] === "m");
  else if (kinds.includes("c") && Math.random() < .45) pool = pool.filter(x => x[4] === "c");
  else if (kinds.includes("t")) pool = pool.filter(x => x[4] === "t");
  pool = prefer(pool, x => x[2] === "es", .2);
  // Busy days and early mornings stay calm; otherwise about one line in four has some humor.
  const calmOnly = c.left >= 5 || c.b === "early";
  pool = calmOnly ? (pool.some(x => x[3] === "calm") ? pool.filter(x => x[3] === "calm") : pool) : prefer(pool, x => x[3] === "fun", .25);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  G.id = pick[0]; G.bucket = c.b; G.day = today();
  recent = recent.filter(id => id !== pick[0]).concat(pick[0]).slice(-10);
  try { localStorage.setItem("hub-greet-recent", JSON.stringify(recent)); } catch (e) {}
  return pick;
}
function greetingText(c){
  let line = (G.id && G.bucket === c.b && G.day === today()) ? LINES.find(x => x[0] === G.id) : null;
  let text = line ? line[5](c) : null;
  for (let i = 0; !text && i < 3; i++) { line = pickGreeting(c); text = line ? line[5](c) : null; }
  return text || (c.b === "night" ? "Still up?" : "Hi" + nm(c) + ".");
}

/* ---------- the orb ---------- */
const ORB = { t: 0, amp: .035, spd: .7, glow: .55, energy: 0, raf: 0, last: 0, shown: "" };
const TAU = Math.PI * 2;
const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function drawOrb(cv, state){
  const css = cv.clientWidth || 160, dpr = Math.min(window.devicePixelRatio || 1, 3), px = Math.round(css * dpr);
  if (cv.width !== px) { cv.width = px; cv.height = px; }
  const g = cv.getContext("2d"); if (!g) return;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, css, css);
  const c = css / 2, R = css * .29 * (1 + .05 * ORB.energy), t = ORB.t;
  // Colors follow the time-of-day accent (49ers red on game days); a saved flash turns it green.
  const O = state === "saved" ? { hi: "#B8F0D2", mid: "#1F9D63", lo: "#0B3A25", halo: "40,190,120" } : (THEME.orb || { hi: "#b4c0ff", mid: "#3d53e0", lo: "#111b58", halo: "112,134,255" });
  // halo
  let gr = g.createRadialGradient(c, c, R * .7, c, c, css * .5);
  gr.addColorStop(0, "rgba(" + O.halo + "," + (.42 * ORB.glow).toFixed(3) + ")"); gr.addColorStop(1, "rgba(" + O.halo + ",0)");
  g.fillStyle = gr; g.fillRect(0, 0, css, css);
  // rings that travel outward while listening
  if (state === "listen") for (let i = 0; i < 3; i++) {
    const p = (t * .22 + i / 3) % 1;
    g.beginPath(); g.arc(c, c, R * (1.08 + p * .58), 0, TAU);
    g.strokeStyle = "rgba(" + O.halo + "," + ((1 - p) * .5).toFixed(3) + ")"; g.lineWidth = 1.5; g.stroke();
  }
  // living outline
  g.beginPath();
  for (let i = 0; i <= 80; i++) {
    const a = i / 80 * TAU;
    const r = R * (1 + ORB.amp * (Math.sin(a * 3 + t * 1.3) + .6 * Math.sin(a * 5 - t * 1.9) + .4 * Math.sin(a * 2 + t * .7)));
    const x = c + Math.cos(a) * r, y = c + Math.sin(a) * r;
    if (i) g.lineTo(x, y); else g.moveTo(x, y);
  }
  g.closePath(); g.save(); g.clip();
  gr = g.createRadialGradient(c - R * .3, c - R * .35, R * .1, c, c, R * 1.3);
  gr.addColorStop(0, O.hi); gr.addColorStop(.5, O.mid); gr.addColorStop(1, O.lo);
  g.fillStyle = gr; g.fillRect(0, 0, css, css);
  // drifting light inside
  g.globalCompositeOperation = "lighter";
  const lights = [["92,214,232", 1, .9, 0], ["186,140,255", .8, 1.3, 2], ["255,143,199", 1.25, .7, 4]];
  for (const L of lights) {
    const x = c + Math.cos(t * L[1] * .6 + L[3]) * R * .55, y = c + Math.sin(t * L[2] * .6 + L[3] * 1.3) * R * .55;
    const b = g.createRadialGradient(x, y, 0, x, y, R * .95);
    b.addColorStop(0, "rgba(" + L[0] + ",.55)"); b.addColorStop(1, "rgba(" + L[0] + ",0)");
    g.fillStyle = b; g.fillRect(0, 0, css, css);
  }
  g.globalCompositeOperation = "source-over";
  const sp = g.createRadialGradient(c - R * .36, c - R * .46, 0, c - R * .36, c - R * .46, R * .62);
  sp.addColorStop(0, "rgba(255,255,255,.6)"); sp.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = sp; g.fillRect(0, 0, css, css);
  g.restore();
  // satellites while thinking
  if (state === "think") for (let i = 0; i < 3; i++) {
    const a = t * 1.1 + i * TAU / 3;
    g.beginPath(); g.arc(c + Math.cos(a) * R * 1.34, c + Math.sin(a) * R * 1.22, 2.8, 0, TAU);
    g.fillStyle = "rgba(" + O.halo + ",.95)"; g.fill();
  }
}
function orbLoop(now){
  const cvs = document.querySelectorAll("canvas[data-orb]");
  if (!cvs.length) { ORB.raf = 0; return; }
  const dt = Math.min(.05, ORB.last ? (now - ORB.last) / 1000 : .016); ORB.last = now;
  const s = orbState();
  const tg = s === "listen" ? [.1, 2.2, 1] : s === "think" ? [.05, 3.2, .8] : s === "speak" ? [.06 + .1 * ORB.energy, 1.9, .9] : s === "saved" ? [.06, 1.4, 1] : [.035, .7, .55];
  const k = Math.min(1, dt * 4);
  ORB.amp += (tg[0] - ORB.amp) * k; ORB.spd += (tg[1] - ORB.spd) * k; ORB.glow += (tg[2] - ORB.glow) * k;
  ORB.energy *= Math.pow(.2, dt); ORB.t += dt * ORB.spd;
  cvs.forEach(cv => drawOrb(cv, s));
  if (s !== ORB.shown) { ORB.shown = s; const cap = document.getElementById("orb-cap"); if (cap) cap.textContent = orbCaption(s); }

  }
  $("#sheet-root").innerHTML = '<div class="scrim" data-act="scrim"><form class="sheet" data-form="sheet" role="dialog" aria-modal="true" aria-label="' + esc(cfg.title) + '"><h2>' + esc(cfg.title) + '</h2>' + html +
    '<div class="acts">' + (cfg.onDelete ? '<button class="btn danger" type="button" data-act="sheetDelete">Delete</button>' : "") + '<span class="sp"></span><button class="btn ghost" type="button" data-act="sheetClose">Cancel</button><button class="btn" type="submit">Save</button></div></form></div>';
  const first = $("#sf-" + cfg.fields[0].id); if (first && !cfg.noFocus) first.focus();
}
function closeSheet(){ if (D && UI.listening) D.stop().catch(() => {}); sheet = null; $("#sheet-root").innerHTML = ""; pendingRender = false; render(); }
function sheetValues(){
  const o = {};
  sheet.fields.forEach(x => { const el = $("#sf-" + x.id); o[x.id] = x.type === "checkbox" ? el.checked : el.value.trim(); });
  return o;
}

/* ---------- actions ---------- */
const find = (arr, id) => arr.find(x => x.id === id);
function addTask(title, due, pri){
  title = title.trim(); if (!title) return false;
  S.tasks.push({ id: uid(), title, due: due || "", pri: !!pri, done: false, created: Date.now() });
  saveTasks.schedule(); flashSaved(); return true;
}
function addHabit(name){
  name = name.trim(); if (!name) return false;
  S.habits.push({ id: uid(), name, log: {}, created: Date.now() });
  saveHabits.schedule(); return true;
}
function goalSheet(g){
  openSheet({ title: g ? "Edit goal" : "New goal", fields: [
    { id: "title", label: "Goal", value: g && g.title, placeholder: "Read 12 books" },
    { id: "current", label: "So far", type: "number", value: g ? g.current : 0, half: true },
    { id: "target", label: "Target", type: "number", value: g ? g.target : "", half: true, placeholder: "12" },
    { id: "unit", label: "Unit (optional)", value: g && g.unit, placeholder: "books", half: true },
    { id: "due", label: "Target date (optional)", type: "date", value: g && g.due, half: true }
  ], onSave(v){
    const target = parseFloat(v.target);
    if (!v.title) return "Give the goal a name.";
    if (!(target > 0)) return "Set a target number above zero.";
    const data = { title: v.title, current: parseFloat(v.current) || 0, target, unit: v.unit, due: v.due };
    if (g) Object.assign(g, data); else S.goals.push(Object.assign({ id: uid() }, data));
    saveHabits.schedule();
  }, onDelete: g ? () => { S.goals = S.goals.filter(x => x !== g); saveHabits.schedule(); } : null });
}
function noteSheet(id){
  const n = id ? S.notes[id] : null;
  openSheet({ title: n ? "Edit note" : "New note", fields: [
    { id: "title", label: "Title", value: n && n.title, placeholder: "Untitled" },
    { id: "body", label: "Note", type: "textarea", value: n && n.body },
    { id: "pinned", label: "Pin to the top", type: "checkbox", value: n && n.pinned }
  ], onSave(v){
    if (!v.title && !v.body) return "Write something first.";
    const nid = id || uid();
    S.notes[nid] = { title: v.title, body: v.body, pinned: v.pinned, updated: Date.now() };
    saveNote(nid);
  }, onDelete: n ? () => { delete S.notes[id]; saveNote(id); } : null });
}
function splitList(s){ return String(s || "").split(",").map(x => x.trim()).filter(Boolean).slice(0, 12); }
const ACT = {
  settings(){
    openSheet({ title: "Settings", noFocus: true, fields: [
      { id: "assistantName", label: "Assistant name", value: CFG.assistantName, placeholder: "Juno" },
      { id: "teams", label: "Teams to follow (separate with commas)", value: CFG.teams.join(", "), placeholder: "49ers, Thunder, Real Madrid" },
      { id: "topics", label: "News topics (separate with commas)", value: CFG.topics.join(", "), placeholder: "Tech and AI, World news" },
      { id: "thorough", label: "Thorough answers (slower)", type: "checkbox", value: CFG.tier === "thorough" }
    ], onSave(v){
      const before = JSON.stringify([CFG.teams, CFG.topics]);
      CFG = { assistantName: (v.assistantName || "Juno").slice(0, 20), teams: splitList(v.teams), topics: splitList(v.topics), tier: v.thorough ? "thorough" : "fast" };
      saveCfg.schedule();
      setTimeout(() => toast(before !== JSON.stringify([CFG.teams, CFG.topics]) ? "Saved. Scores and headlines catch up at the next refresh." : "Saved"), 50);
    } });
  },
  feedFilter(el){
    UI.feedFilter = el.dataset.f;
    document.querySelectorAll('[data-act="feedFilter"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.f === UI.feedFilter));
    $("#rail-wrap").innerHTML = UI.route === "rundown" ? newsStack() : railHTML();
  },
  later(el){
    const t = find(S.tasks, el.dataset.id); if (!t) return;
    t.due = addDays(today(), 1); saveTasks.schedule(); render(); toast("Moved to tomorrow");
  },
  rollOver(){
    const k = today(), tmr = addDays(k, 1);
    const open = S.tasks.filter(x => !x.done && x.due && x.due <= k);
    if (!open.length) return;
    open.forEach(x => { x.due = tmr; });
    saveTasks.schedule(); render(); toast(open.length === 1 ? "Moved to tomorrow" : open.length + " tasks moved to tomorrow");
  },
  mic(el){ toggleMic(el.dataset.mic); },
  orb(){
    if (AI.busy) { if (AI.ctl) AI.ctl.abort(); return; }
    if (D) { UI.orbTalk = !UI.listening; toggleMic("chat-input"); }
    else { const el = $("#chat-input"); if (el) el.focus(); }
  },
  quick(el){ ask(el.dataset.q === "plan" ? "Look at my tasks, habits and goals and give me a short plan for the rest of today." : "Give me a quick rundown of how my teams are doing and the headlines you have saved."); },
  suggest(el){ ask(el.dataset.q); },
  stopAI(){ if (AI.ctl) AI.ctl.abort(); },
  clearChat(el){
    if (el.dataset.sure) { AI.turns = []; AI.note = ""; saveChat.schedule(); render(); }
    else { el.dataset.sure = "1"; el.textContent = "Tap again to clear"; }
  },
  voiceNote(){ openVoiceNote(true); },
  vnMic(){ toggleMic("vn-text"); },
  vnSave(){
    const body = $("#vn-text").value.trim();
    if (!body) { toast("Nothing to save yet."); return; }
    saveVoice("", body); closeSheet(); toast("Note saved");
  },
  async vnTidy(el){
    const raw = $("#vn-text").value.trim();
    if (!raw) { toast("Nothing to save yet."); return; }
    if (D && UI.listening) D.stop().catch(() => {});
    el.disabled = true; el.textContent = "Tidying...";
    let title = "", body = raw;
    try {
      const out = await AI.sample.json('Clean up this dictated note. Fix punctuation, capitalization and obvious transcription slips, and remove filler words. Keep the meaning, wording and order; do not add anything. Reply with only JSON like {"title": "short title of at most 6 words", "body": "the cleaned note"}.\n\nDictated note:\n' + raw.slice(0, 12000), { modelTier: "quick", cache: false });
      if (out && typeof out.body === "string" && out.body.trim()) { body = out.body.trim(); title = String(out.title || "").slice(0, 80); }
    } catch (e) { setTimeout(() => toast("Couldn't tidy it, so the note was saved as spoken."), 60); }
    if (!sheet) return;
    saveVoice(title, body); closeSheet(); toast("Note saved");
  },
  toggleTask(el){
    const t = find(S.tasks, el.dataset.id); if (!t) return;
    t.done = !t.done;
    if (t.done) { t.doneAt = today(); t.doneTs = Date.now(); } else { delete t.doneAt; delete t.doneTs; }
    saveTasks.schedule(); render();
  },
  editTask(el){
    const t = find(S.tasks, el.dataset.id); if (!t) return;
    openSheet({ title: "Edit task", noFocus: true, fields: [
      { id: "title", label: "Task", value: t.title },
      { id: "due", label: "Due date", type: "date", value: t.due },
      { id: "pri", label: "High priority", type: "checkbox", value: t.pri },
      { id: "note", label: "Note", type: "textarea", value: t.note, placeholder: "Details, links, next step" }
    ], onSave(v){
      if (!v.title) return "A task needs a name.";
      t.title = v.title; t.due = v.due; t.pri = v.pri; t.note = v.note; saveTasks.schedule();
    }, onDelete(){ S.tasks = S.tasks.filter(x => x !== t); saveTasks.schedule(); } });
  },
  addPri(){ UI.addPri = !UI.addPri; const b = $('[data-act="addPri"]'); if (b) b.setAttribute("aria-pressed", UI.addPri); },
  taskFilter(el){ UI.taskFilter = el.dataset.f; render(); },
  clearDone(el){
    if (el.dataset.sure) { S.tasks = S.tasks.filter(x => !x.done); saveTasks.schedule(); render(); toast("Completed tasks deleted"); }
    else { el.dataset.sure = "1"; el.textContent = "Tap again to delete them for good"; }
  },
  toggleHabit(el){
    const h = find(S.habits, el.dataset.id); if (!h) return;
    h.log = h.log || {};
    if (h.log[el.dataset.day]) delete h.log[el.dataset.day]; else h.log[el.dataset.day] = 1;
    saveHabits.schedule(); render();
  },
  suggestHabit(el){ addHabit(el.dataset.name); render(); },
  editHabit(el){
    const h = find(S.habits, el.dataset.id); if (!h) return;
    openSheet({ title: "Edit habit", fields: [{ id: "name", label: "Habit", value: h.name }],
      onSave(v){ if (!v.name) return "A habit needs a name."; h.name = v.name; saveHabits.schedule(); },
      onDelete(){ S.habits = S.habits.filter(x => x !== h); saveHabits.schedule(); } });
  },
  newGoal(){ goalSheet(null); },
  editGoal(el){ const g = find(S.goals, el.dataset.id); if (g) goalSheet(g); },
  stepGoal(el){
    const g = find(S.goals, el.dataset.id); if (!g) return;
    g.current = Math.max(0, Math.round(((Number(g.current) || 0) + Number(el.dataset.n)) * 100) / 100);
    saveHabits.schedule(); render();
  },
  jTab(el){ UI.jTab = el.dataset.t; render(); },
  jStep(el){ const k = addDays(UI.jDate, Number(el.dataset.n)); if (k <= today()) { UI.jDate = k; render(); } },
  jToday(){ UI.jDate = today(); render(); },
  jOpen(el){ UI.jDate = el.dataset.day; render(); window.scrollTo({ top: 0 }); },
  newNote(){ noteSheet(null); },
  editNote(el){ noteSheet(el.dataset.id); },
  scrim(el, e){ if (e.target === el) closeSheet(); },
  sheetClose(){ closeSheet(); },
  sheetDelete(el){
    if (el.dataset.sure) { const fn = sheet.onDelete; fn(); closeSheet(); toast("Deleted"); }
    else { el.dataset.sure = "1"; el.textContent = "Tap again to delete"; }
  }
};
const FORMS = {
  ask(f){ ask(f.q.value); },
  chat(f){ ask(f.q.value); },
  noop(){},
  quickTask(f){ if (addTask(f.title.value, today(), false)) { UI.focusAfter = "quick-task"; render(); } },
  addTask(f){ if (addTask(f.title.value, f.due.value, UI.addPri)) { UI.addPri = false; UI.focusAfter = "new-task"; render(); } },
  addHabit(f){ if (addHabit(f.name.value)) { UI.focusAfter = "new-habit"; render(); } },
  sheet(){ if (!sheet || sheet.custom) return; const err = sheet.onSave(sheetValues()); if (err) toast(err); else closeSheet(); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const fn = FORMS[e.target.dataset.form]; if (fn) fn(e.target);
});
document.addEventListener("input", e => {
  const el = e.target, kind = el.dataset && el.dataset.input;
  if (kind === "draft") { UI.draft = el.value; }
  else if (kind === "entry") {
    const k = el.dataset.day;
    S.days[k] = { text: el.value, updated: Date.now() };
    saveDay(k); grow(el);
    const w = $("#wc"); if (w) w.textContent = wc(el.value);
  } else if (kind === "noteQ") {
    UI.noteQ = el.value;
    const q = UI.noteQ.trim().toLowerCase();
    const list = Object.keys(S.notes).map(id => Object.assign({ id }, S.notes[id]))
      .filter(n => !q || (n.title + " " + n.body).toLowerCase().includes(q))
      .sort((a, b) => (!!b.pinned - !!a.pinned) || ((b.updated || 0) - (a.updated || 0)));
    $("#note-list").innerHTML = notesList(list, q);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet) closeSheet(); });

function route(){
  const h = location.hash.replace("#", "");
  UI.route = ROUTES.includes(h) ? h : "home";
  if (UI.route === "journal") UI.jDate = UI.jDate > today() ? today() : UI.jDate;
  render(); if (UI.route === "assistant") scrollChat(); else window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", route);
// Roll the page over at midnight or when it comes back into view on a new day.
let shownDay = today(), hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  applyTheme();
  // Coming back after a while counts as a new visit, so the greeting gets a fresh line.
  if (hiddenAt && Date.now() - hiddenAt > 20 * 60e3) G.id = "";
  if (today() !== shownDay) { shownDay = today(); UI.jDate = shownDay; G.id = ""; }
  if (UI.ready) softRender();
});
// Keep the colors in step with the sun, and refresh Today when the part of the day changes.
setInterval(() => {
  applyTheme();
  if (UI.ready && UI.route === "home" && !sheet) {
    const c = new Date(), mode = bucketNow(c.getHours()) + ((c.getHours() >= 19 || c.getHours() < 4) ? "e" : "");
    if (mode !== UI.todayMode) softRender();
  }
}, 60e3);
applyTheme();

UI.route = ROUTES.includes(location.hash.replace("#", "")) ? location.hash.replace("#", "") : "home";
boot();
})();
</script>
